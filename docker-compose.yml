services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qualitylens}
      POSTGRES_USER: ${POSTGRES_USER:-qualitylens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qualitylens-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qualitylens} -d ${POSTGRES_DB:-qualitylens}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://qualitylens:qualitylens-local@postgres:5432/qualitylens}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      ALERT_QUALITY_THRESHOLD: ${ALERT_QUALITY_THRESHOLD:-80}
      NUMERIC_DRIFT_THRESHOLD: ${NUMERIC_DRIFT_THRESHOLD:-0.20}
      CATEGORICAL_DRIFT_THRESHOLD: ${CATEGORICAL_DRIFT_THRESHOLD:-0.10}
      MISSING_DRIFT_THRESHOLD: ${MISSING_DRIFT_THRESHOLD:-0.05}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    volumes:
      - upload_data:/app/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  upload_data:
