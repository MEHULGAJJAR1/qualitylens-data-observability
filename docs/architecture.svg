<rect x="310" y="529" width="210" height="99" rx="14" class="box"/><text x="330" y="558" class="cap">LOCAL SCHEDULING</text><text x="330" y="584" class="head">APScheduler</text><text x="330" y="604" class="text">Persisted interval schedules</text>
<rect x="579" y="529" width="297" height="99" rx="14" class="box"/><text x="600" y="558" class="cap">OPTIONAL ORCHESTRATION</text><text x="600" y="584" class="head">Apache Airflow DAG</text><text x="600" y="604" class="text">POST /api/v1/runs · Airflow not required locally</text>
