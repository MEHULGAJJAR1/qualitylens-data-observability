<rect x="600" y="321" width="255" height="49" rx="9" fill="#f3efff" stroke="#e5ddff"/><circle cx="620" cy="345" r="10" fill="#8169dc"/><text x="617" y="349" style="font:700 10px system-ui;fill:#fff">3</text><text x="639" y="342" class="head">Compare drift &amp; schema</text><text x="639" y="357" class="text">PSI / TV · type / rename changes</text>
<rect x="600" y="380" width="255" height="49" rx="9" fill="#fff5e7" stroke="#f2e5cd"/><circle cx="620" cy="404" r="10" fill="#cc8e27"/><text x="617" y="408" style="font:700 10px system-ui;fill:#fff">4</text><text x="639" y="401" class="head">Alert, report &amp; persist</text><text x="639" y="416" class="text">Dedup · JSON / CSV / HTML</text>
<text x="600" y="460" class="text">Optional: Great Expectations · Evidently · SMTP</text>
