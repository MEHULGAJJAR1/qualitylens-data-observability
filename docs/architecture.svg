<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" role="img" aria-labelledby="title desc">
<title id="title">QualityLens system architecture</title><desc id="desc">Browser application, FastAPI API, data processing, relational persistence, storage and scheduler integrations.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f5f8ff"/><stop offset="1" stop-color="#eef2f8"/></linearGradient><linearGradient id="blue" x1="0" x2="1"><stop stop-color="#6888fa"/><stop offset="1" stop-color="#4f6fe5"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#24365d" flood-opacity=".10"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7d8ca8"/></marker><style>.title{font:700 24px system-ui,sans-serif;fill:#1d2d4b}.sub{font:12px system-ui,sans-serif;fill:#73819a}.box{fill:#fff;stroke:#dce4f0;stroke-width:1.2;filter:url(#shadow)}.head{font:700 13px system-ui,sans-serif;fill:#20314f}.text{font:11px system-ui,sans-serif;fill:#687791}.cap{font:700 9px system-ui,sans-serif;letter-spacing:1px;fill:#8794a9}.arr{stroke:#8391aa;stroke-width:1.6;fill:none;marker-end:url(#arrow)}.lightarr{stroke:#9dafd0;stroke-dasharray:5 5;stroke-width:1.3;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1180" height="700" rx="24" fill="url(#bg)"/><text x="48" y="53" class="title">QualityLens · system architecture</text><text x="48" y="78" class="sub">A persisted, API-first data quality and drift monitoring workflow</text>
<!-- Browser -->
<rect x="42" y="132" width="212" height="330" rx="16" class="box"/><rect x="42" y="132" width="212" height="47" rx="16" fill="#152543"/><path d="M42 162v17h212v-17" fill="#152543"/><text x="61" y="160" style="font:700 13px system-ui;fill:#fff">WEB APP</text><text x="61" y="211" class="head">React 18 · TypeScript</text><text x="61" y="235" class="text">Vite · Tailwind · Router</text><text x="61" y="256" class="text">TanStack Query · Recharts</text><text x="61" y="277" class="text">Responsive light / dark UI</text><line x1="61" y1="299" x2="235" y2="299" stroke="#e8edf4"/><text x="61" y="324" class="cap">OPERATIONS</text><text x="61" y="348" class="text">Datasets · Quality · Drift</text><text x="61" y="369" class="text">Schema · Runs · Alerts</text><text x="61" y="390" class="text">Reports · Settings</text><rect x="61" y="414" width="164" height="28" rx="7" fill="#eef3ff"/><text x="75" y="432" style="font:600 9px system-ui;fill:#4e6de1">/api/v1 · same-origin proxy</text>
<!-- API -->
<rect x="310" y="132" width="210" height="330" rx="16" class="box"/><rect x="310" y="132" width="210" height="47" rx="16" fill="url(#blue)"/><path d="M310 162v17h210v-17" fill="url(#blue)"/><text x="330" y="160" style="font:700 13px system-ui;fill:#fff">FASTAPI REST</text><text x="330" y="211" class="head">Pydantic · SQLAlchemy</text><text x="330" y="235" class="text">Versioned /api/v1 endpoints</text><text x="330" y="256" class="text">Validation · pagination</text><text x="330" y="277" class="text">CORS · request logging</text><line x1="330" y1="299" x2="500" y2="299" stroke="#e8edf4"/><text x="330" y="324" class="cap">SERVICES</text><text x="330" y="348" class="text">Dataset &amp; profile service</text><text x="330" y="369" class="text">Monitoring orchestrator</text><text x="330" y="390" class="text">Report &amp; alert service</text><rect x="330" y="414" width="164" height="28" rx="7" fill="#eff8f4"/><text x="345" y="432" style="font:600 9px system-ui;fill:#19866b">OpenAPI · Swagger UI</text>
<!-- Engine -->
<rect x="579" y="105" width="297" height="384" rx="17" class="box"/><rect x="579" y="105" width="297" height="50" rx="17" fill="#223654"/><path d="M579 135v20h297v-20" fill="#223654"/><text x="600" y="136" style="font:700 13px system-ui;fill:#fff">MONITORING ENGINE</text><text x="600" y="185" class="cap">ONE RUN · REAL INPUTS · PERSISTED RESULTS</text>
<rect x="600" y="203" width="255" height="49" rx="9" fill="#eef3ff" stroke="#dce5ff"/><circle cx="620" cy="227" r="10" fill="#5b78ed"/><text x="617" y="231" style="font:700 10px system-ui;fill:#fff">1</text><text x="639" y="224" class="head">Profile &amp; inspect</text><text x="639" y="239" class="text">Pandas · NumPy · column stats</text>
